<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroPulse</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── TOKENS ─────────────────────────────────────── */
:root {
  --bg:       #09090f;
  --bg-card:  #0f1117;
  --bg-hover: #141720;
  --border:   #252836;
  --text:     #f0f3f8;
  --t2:       #b0bccf;
  --t3:       #6b7a92;
  --green:    #22c55e;
  --green-bg: rgba(34,197,94,.07);
  --red:      #ef4444;
  --red-bg:   rgba(239,68,68,.07);
  --yellow:   #eab308;
  --yellow-bg:rgba(234,179,8,.07);
  --orange:   #f97316;
  --orange-bg:rgba(249,115,22,.07);
  --blue:     #60a5fa;
  --radius:   12px;
  --radius-sm:8px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ─────────────────────────────────────── */
.bar {
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:48px;
  background:rgba(9,9,15,.8);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.bar-logo {
  font-size:.95em;font-weight:700;letter-spacing:1.5px;
  background:linear-gradient(120deg,var(--blue),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.bar-right{display:flex;align-items:center;gap:12px}
.bar-time{font-size:.75em;color:var(--t2)}
.live{display:flex;align-items:center;gap:6px;font-size:.75em;color:var(--green)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn-refresh {
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  color:var(--t2);font-size:.78em;cursor:pointer;transition:all .2s;
}
.btn-refresh:hover{color:var(--blue);border-color:var(--blue)}

/* ── MAIN ────────────────────────────────────────── */
.main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}

/* ── HERO SIGNAL ─────────────────────────────────── */
.hero {
  border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
  margin-bottom:16px;
  transition:background .6s;
}
.hero-inner{display:grid;grid-template-columns:240px 1fr;min-height:180px}

.hero-score {
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;
  border-right:1px solid var(--border);
}
.hero-score-label{font-size:.68em;letter-spacing:2px;text-transform:uppercase;color:var(--t2);margin-bottom:4px}
.hero-score-num {
  font-size:88px;font-weight:800;line-height:1;letter-spacing:-4px;
  font-variant-numeric:tabular-nums;transition:color .4s;
}
.hero-score-sub{font-size:.8em;color:var(--t2);margin-top:2px}

.hero-signal{padding:32px 32px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.signal-pill {
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:100px;
  font-size:.9em;font-weight:700;letter-spacing:1px;
  width:fit-content;transition:all .4s;
}
.signal-title{font-size:1.5em;font-weight:700;transition:color .4s}
.signal-body{font-size:.88em;color:var(--t2);max-width:460px;line-height:1.65}
.signal-action{
  font-size:.82em;font-weight:600;padding:6px 12px;
  border-radius:var(--radius-sm);width:fit-content;
}
.hero-drivers{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.driver-chip{
  padding:3px 10px;border-radius:100px;
  font-size:.74em;font-weight:600;
}

/* signal color variants */
.risk-on   .hero{ background:linear-gradient(135deg,rgba(34,197,94,.06) 0%,transparent 55%)}
.risk-on   .hero-score-num,.risk-on .signal-title{color:var(--green)}
.risk-on   .signal-pill{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.risk-on   .signal-action{background:rgba(34,197,94,.1);color:var(--green)}
.risk-on   .live-dot,.risk-on .live{color:var(--green)}

.bullish   .hero{background:linear-gradient(135deg,rgba(34,197,94,.04) 0%,transparent 55%)}
.bullish   .hero-score-num,.bullish .signal-title{color:#4ade80}
.bullish   .signal-pill{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.bullish   .signal-action{background:rgba(74,222,128,.08);color:#4ade80}

.neutral   .hero{background:linear-gradient(135deg,rgba(234,179,8,.04) 0%,transparent 55%)}
.neutral   .hero-score-num,.neutral .signal-title{color:var(--yellow)}
.neutral   .signal-pill{background:rgba(234,179,8,.1);color:var(--yellow);border:1px solid rgba(234,179,8,.25)}
.neutral   .signal-action{background:rgba(234,179,8,.08);color:var(--yellow)}

.bearish   .hero{background:linear-gradient(135deg,rgba(249,115,22,.04) 0%,transparent 55%)}
.bearish   .hero-score-num,.bearish .signal-title{color:var(--orange)}
.bearish   .signal-pill{background:rgba(249,115,22,.1);color:var(--orange);border:1px solid rgba(249,115,22,.25)}
.bearish   .signal-action{background:rgba(249,115,22,.08);color:var(--orange)}

.risk-off  .hero{background:linear-gradient(135deg,rgba(239,68,68,.06) 0%,transparent 55%)}
.risk-off  .hero-score-num,.risk-off .signal-title{color:var(--red)}
.risk-off  .signal-pill{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.risk-off  .signal-action{background:rgba(239,68,68,.1);color:var(--red)}

.d-bull{background:rgba(34,197,94,.1);color:var(--green)}
.d-bear{background:rgba(239,68,68,.1);color:var(--red)}

/* ── QUICK METRICS ───────────────────────────────── */
.metrics-strip{
  display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none;
}
.metrics-strip::-webkit-scrollbar{display:none}
.metric-pill{
  display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:100px;
  background:var(--bg-card);border:1px solid var(--border);
  white-space:nowrap;flex-shrink:0;transition:border-color .2s;
}
.metric-pill:hover{border-color:var(--t3)}
.metric-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.metric-name{font-size:.72em;color:var(--t2);letter-spacing:.3px}
.metric-val {font-size:.85em;font-weight:600;font-variant-numeric:tabular-nums}
.metric-chg {font-size:.72em}
.c-g{color:var(--green)} .c-r{color:var(--red)} .c-y{color:var(--yellow)} .c-o{color:var(--orange)} .c-b{color:var(--blue)}
.bg-g{background:var(--green)} .bg-r{background:var(--red)} .bg-y{background:var(--yellow)} .bg-o{background:var(--orange)}

/* ── SECTION TITLE ───────────────────────────────── */
.sec{font-size:.68em;text-transform:uppercase;letter-spacing:2px;color:var(--t2);
  margin:24px 0 12px;display:flex;align-items:center;justify-content:space-between}
.sec a{font-size:1em;color:var(--blue);text-decoration:none;letter-spacing:0;text-transform:none}
.sec a:hover{text-decoration:underline}

/* ── INDICATOR GRID ──────────────────────────────── */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;margin-bottom:16px}

.ind-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;gap:10px;
  transition:transform .15s,border-color .15s;cursor:default;
  position:relative;overflow:hidden;
}
.ind-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--radius) var(--radius) 0 0;
}
.ind-card.c-g::before{background:var(--green)}
.ind-card.c-r::before{background:var(--red)}
.ind-card.c-y::before{background:var(--yellow)}
.ind-card.c-o::before{background:var(--orange)}
.ind-card.c-b::before{background:var(--blue)}
.ind-card:hover{transform:translateY(-2px);border-color:var(--t3)}

.ind-head{display:flex;justify-content:space-between;align-items:center}
.ind-name{font-size:.7em;color:var(--t2);text-transform:uppercase;letter-spacing:.8px}
.ind-badge{font-size:.65em;font-weight:700;padding:2px 7px;border-radius:100px}
.ind-badge.c-g{background:rgba(34,197,94,.12);color:var(--green)}
.ind-badge.c-r{background:rgba(239,68,68,.12);color:var(--red)}
.ind-badge.c-y{background:rgba(234,179,8,.12);color:var(--yellow)}
.ind-badge.c-o{background:rgba(249,115,22,.12);color:var(--orange)}

.ind-val{font-size:1.75em;font-weight:700;letter-spacing:-1px;line-height:1}
.ind-val.c-g{color:var(--green)} .ind-val.c-r{color:var(--red)} .ind-val.c-y{color:var(--yellow)} .ind-val.c-o{color:var(--orange)}
.ind-unit{font-size:.45em;font-weight:400;opacity:.6;margin-left:1px}

.ind-change{font-size:.75em;color:var(--t2);display:flex;align-items:center;gap:4px}

.bar-track{height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.bar-fill.c-g{background:var(--green)} .bar-fill.c-r{background:var(--red)}
.bar-fill.c-y{background:var(--yellow)} .bar-fill.c-o{background:var(--orange)}

.ind-hint{font-size:.72em;color:var(--t2);line-height:1.45}

/* ── SP500 CARD ──────────────────────────────────── */
.sp500-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 24px;
  display:grid;grid-template-columns:160px 1fr;gap:32px;align-items:center;
  margin-bottom:16px;position:relative;overflow:hidden;
}
.sp500-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sp500-card.c-g::before{background:var(--green)} .sp500-card.c-r::before{background:var(--red)}

.sp-ticker{font-size:.68em;text-transform:uppercase;letter-spacing:1.5px;color:var(--t2);margin-bottom:4px}
.sp-price{font-size:2em;font-weight:800;letter-spacing:-2px;line-height:1}
.sp-sma-val{font-size:.78em;color:var(--t2);margin-top:6px}
.sp-pct{font-size:1em;font-weight:700;margin-top:4px}

.sp-bar-label{font-size:.7em;color:var(--t2);margin-bottom:8px;
  display:flex;justify-content:space-between}
.sp-track{
  height:10px;background:rgba(255,255,255,.05);
  border-radius:100px;position:relative;overflow:visible;
}
.sp-zone{position:absolute;top:0;height:100%;border-radius:100px;opacity:.3}
.sp-sma-line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--yellow);
  border-radius:1px;transform:translateX(-50%);opacity:.8}
.sp-cursor{position:absolute;top:-5px;bottom:-5px;width:5px;background:#fff;
  border-radius:100px;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.3)}
.sp-legend{display:flex;justify-content:space-between;margin-top:7px;
  font-size:.68em;color:var(--t2)}
.sp-status{margin-top:10px;font-size:.8em}

/* ── PORTFOLIO ────────────────────────────────────── */
.port-summary{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:12px;
}
.port-cell{background:var(--bg-card);padding:14px 18px}
.port-label{font-size:.68em;text-transform:uppercase;letter-spacing:1px;color:var(--t2);margin-bottom:4px}
.port-val{font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums}

.holdings-tbl{width:100%;border-collapse:collapse;font-size:.82em;margin-bottom:24px}
.holdings-tbl th{
  padding:9px 12px;text-align:left;font-size:.7em;font-weight:500;
  text-transform:uppercase;letter-spacing:.8px;color:var(--t2);
  border-bottom:1px solid var(--border);
}
.holdings-tbl td{
  padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);
}
.holdings-tbl tr:last-child td{border-bottom:none}
.holdings-tbl tr:hover td{background:var(--bg-hover)}
.holdings-tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.ticker{font-weight:700;color:var(--blue);font-size:.9em}
.sec-name{color:var(--t2);font-size:.85em}
.type-chip{padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.05);
  color:var(--t2);font-size:.75em}

.plaid-cta{
  background:var(--bg-card);border:1px dashed var(--border);
  border-radius:var(--radius);padding:36px;text-align:center;margin-bottom:16px;
}
.plaid-cta h3{font-size:.95em;margin-bottom:8px}
.plaid-cta p{font-size:.83em;color:var(--t2);margin-bottom:18px;max-width:400px;margin-left:auto;margin-right:auto;line-height:1.65}
.plaid-btn{
  display:inline-block;padding:9px 22px;
  background:var(--blue);color:#fff;border-radius:var(--radius-sm);
  font-size:.85em;font-weight:600;text-decoration:none;
  transition:opacity .2s;
}
.plaid-btn:hover{opacity:.82}

/* ── SOCIAL ──────────────────────────────────────── */
.social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-bottom:16px}
.soc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.soc-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.soc-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.8em;
}
.av-x{background:#000;color:#fff;border:1px solid #333}
.av-t{background:#1a1a1a;color:#fff;border:1px solid #444}
.soc-author{font-weight:600;font-size:.83em}
.soc-time{font-size:.7em;color:var(--t2)}
.soc-text{font-size:.82em;line-height:1.55;color:var(--text);margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.soc-stats{display:flex;gap:14px;font-size:.72em;color:var(--t2)}

/* ── LOGS ────────────────────────────────────────── */
.log-tbl{width:100%;border-collapse:collapse;font-size:.78em}
.log-tbl th{padding:8px 12px;text-align:left;font-size:.7em;font-weight:500;
  text-transform:uppercase;letter-spacing:.8px;color:var(--t2);
  background:var(--bg-card);border-bottom:1px solid var(--border)}
.log-tbl td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--t2)}
.log-tbl tr:hover td{background:var(--bg-hover)}
.log-tag{padding:2px 7px;border-radius:4px;background:rgba(96,165,250,.1);color:var(--blue);font-size:.85em}

/* ── HISTORY MODAL ───────────────────────────────── */
.modal-overlay {
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal {
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:16px;width:100%;max-width:720px;
  max-height:85vh;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.modal-header {
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-title{font-size:1em;font-weight:600}
.modal-meta {font-size:.78em;color:var(--t2)}
.modal-close {
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:transparent;color:var(--t2);cursor:pointer;font-size:1em;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.modal-close:hover{background:var(--bg-hover);color:var(--text)}

.modal-range {
  display:flex;gap:6px;padding:14px 22px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.range-btn {
  padding:5px 14px;border-radius:100px;border:1px solid var(--border);
  background:transparent;color:var(--t2);font-size:.78em;cursor:pointer;transition:all .15s;
}
.range-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.range-btn:hover:not(.active){border-color:var(--t3);color:var(--text)}

.modal-stats {
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0;
}
.stat-cell{background:var(--bg-card);padding:10px 14px}
.stat-label{font-size:.65em;text-transform:uppercase;letter-spacing:1px;color:var(--t2);margin-bottom:3px}
.stat-val  {font-size:.95em;font-weight:600;font-variant-numeric:tabular-nums}

.modal-chart-wrap{padding:20px 22px;flex:1;min-height:0;position:relative}
.modal-chart-wrap canvas{max-height:280px}

.modal-loading{
  display:flex;align-items:center;justify-content:center;
  height:200px;color:var(--t2);font-size:.85em;gap:10px;
}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* make indicator cards clickable */
.ind-card{cursor:pointer}
.ind-card:hover{border-color:rgba(96,165,250,.35)}

/* ── SKELETON ────────────────────────────────────── */
.skel{
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-hover) 50%,var(--bg-card) 75%);
  background-size:200% 100%;animation:shimmer 1.8s infinite;border-radius:var(--radius);
}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ── RESPONSIVE ──────────────────────────────────── */
@media(max-width:640px){
  .hero-inner{grid-template-columns:1fr}
  .hero-score{border-right:none;border-bottom:1px solid var(--border);padding:24px}
  .hero-score-num{font-size:64px}
  .sp500-card{grid-template-columns:1fr}
  .main{padding:16px 14px 60px}
}
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────── -->
<header class="bar">
  <span class="bar-logo">MACROPULSE</span>
  <div class="bar-right">
    <span class="live"><span class="live-dot"></span>Live</span>
    <span class="bar-time" id="bar-time">—</span>
    <button class="btn-refresh" onclick="loadAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<!-- ── MAIN ────────────────────────────────────────── -->
<div class="main" id="app">

  <!-- HERO -->
  <div id="hero-wrap" class="neutral">
    <div class="hero" id="hero">
      <div class="hero-inner">
        <div class="hero-score">
          <div class="hero-score-label">Macro Score</div>
          <div class="hero-score-num" id="score-num">—</div>
          <div class="hero-score-sub">/100</div>
        </div>
        <div class="hero-signal">
          <div class="signal-pill" id="sig-pill">Loading…</div>
          <div class="signal-title" id="sig-title">Analyzing market…</div>
          <div class="signal-body" id="sig-body">Fetching macro indicators…</div>
          <div class="signal-action" id="sig-action">Please wait</div>
          <div class="hero-drivers" id="drivers"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- QUICK METRICS STRIP -->
  <div class="metrics-strip" id="metrics-strip">
    <div class="metric-pill skel" style="width:100px;height:36px"></div>
    <div class="metric-pill skel" style="width:110px;height:36px"></div>
    <div class="metric-pill skel" style="width:100px;height:36px"></div>
    <div class="metric-pill skel" style="width:100px;height:36px"></div>
    <div class="metric-pill skel" style="width:110px;height:36px"></div>
  </div>

  <!-- INDICATORS -->
  <div class="sec">Macro Indicators</div>
  <div class="ind-grid" id="ind-grid">
    <div class="skel" style="height:158px"></div>
    <div class="skel" style="height:158px"></div>
    <div class="skel" style="height:158px"></div>
    <div class="skel" style="height:158px"></div>
    <div class="skel" style="height:158px"></div>
  </div>

  <!-- SP500 -->
  <div class="sec">S&amp;P 500 / SPY</div>
  <div id="sp500-wrap"><div class="skel" style="height:110px;margin-bottom:16px"></div></div>

  <!-- HOLDINGS -->

<script>
// ═══════════════════════════════════════════════════
// INDICATOR CONFIG
// ═══════════════════════════════════════════════════
var CFG = {
  VIX: {
    name:'VIX', label:'VIX', unit:'', w:3,
    score:function(v){return v<13?2:v<18?1:v<25?0:v<35?-1:-2},
    bar:  function(v){return cl((50-v)/40*100)},
    hint: function(v){return v<13?'Extreme calm — market complacent':v<18?'Low fear — good conditions for longs':v<25?'Elevated uncertainty':v<35?'High fear — defensive shift warranted':'Panic — risk-off'}
  },
  FG: {
    name:'Fear & Greed', label:'Fear/Greed', unit:'/100', w:2,
    score:function(v){return v>=75?2:v>=55?1:v>=45?0:v>=25?-1:-2},
    bar:  function(v){return cl(v)},
    hint: function(v){return v>=75?'Extreme Greed — euphoric, watch for exhaustion':v>=55?'Greed — bullish momentum intact':v>=45?'Neutral sentiment':v>=25?'Fear — risk appetite declining':'Extreme Fear — contrarian buy zone?'}
  },
  T10Y2Y: {
    name:'Yield Curve', label:'Yield Curve', unit:'%', w:3,
    score:function(v){return v>1?2:v>0?1:v>-0.5?-1:-2},
    bar:  function(v){return cl((v+2)/4*100)},
    hint: function(v){return v>1?'Steep — expansion phase':v>0?'Normal — modest growth expected':v>-0.5?'Slight inversion — caution':'Deep inversion — recession warning'}
  },
  FEDFUNDS: {
    name:'Fed Rate', label:'Fed Rate', unit:'%', w:2,
    score:function(v){return v<=2?2:v<=3.5?1:v<=5?0:v<=6?-1:-2},
    bar:  function(v){return cl((8-v)/8*100)},
    hint: function(v){return v<=2?'Highly accommodative':v<=3.5?'Neutral — mild tailwind':v<=5?'Restrictive — tighter conditions':v<=6?'Very restrictive':'Extreme tightening'}
  },
  CPI: {
    name:'CPI Inflation', label:'CPI', unit:'%', w:2,
    score:function(v){return v<=2.2?2:v<=3?1:v<=5?-1:-2},
    bar:  function(v){return cl((10-v)/10*100)},
    hint: function(v){return v<=2.2?'On target — Fed has room to cut':v<=3?'Slightly elevated — manageable':v<=5?'High — erosion of real returns':'Runaway inflation — stagflation risk'}
  },
  UNRATE: {
    name:'Unemployment', label:'Unemploy.', unit:'%', w:2,
    score:function(v){return v<=3.5?2:v<=4.5?1:v<=6?-1:-2},
    bar:  function(v){return cl((10-v)/8*100)},
    hint: function(v){return v<=3.5?'Near full employment':v<=4.5?'Healthy labor market':v<=6?'Softening — watch trend':'Elevated — recessionary'}
  },
  PMI: {
    name:'PMI', label:'PMI', unit:'', w:2,
    score:function(v){return v>=57?2:v>=52?1:v>=48?-1:-2},
    bar:  function(v){return cl((v-40)/25*100)},
    hint: function(v){return v>=57?'Strong expansion':v>=52?'Expanding above 50':v>=48?'Borderline — slowing':'Contraction — sub-50 is bearish'}
  },
  GDP: {
    name:'GDP Growth', label:'GDP', unit:'%', w:2,
    score:function(v){return v>=3?2:v>=1.5?1:v>=0?-1:-2},
    bar:  function(v){return cl((v+5)/10*100)},
    hint: function(v){return v>=3?'Strong growth — risk-on':v>=1.5?'Moderate growth':v>=0?'Near stall speed':'Contraction — recession'}
  },
  DGS10: {
    name:'10Y Treasury', label:'10Y Yield', unit:'%', w:1,
    score:function(v){return v<=3?1:v<=4.5?0:v<=6?-1:-2},
    bar:  function(v){return cl((8-v)/8*100)},
    hint: function(v){return v<=3?'Low rates — accommodative':v<=4.5?'Moderate — manageable':v<=6?'High — headwind for multiples':'Very high — valuation pressure'}
  }
};

function cl(v){return Math.max(0,Math.min(100,v))}

// ═══════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════
function calcScore(indicators) {
  var total=0, max=0, drivers=[];
  var map={};
  indicators.forEach(function(i){map[i.id]=i});

  Object.keys(CFG).forEach(function(id){
    var cfg=CFG[id], ind=map[id];
    if(!ind||ind.rawValue===null) return;
    var s=cfg.score(ind.rawValue);
    total+=s*cfg.w; max+=2*cfg.w;
    drivers.push({id:id,name:cfg.name,s:s*cfg.w});
  });

  // SP500 vs SMA200
  var sp=map['SP500'];
  if(sp&&sp.rawValue&&sp.previousValue){
    var pct=(sp.rawValue-sp.previousValue)/sp.previousValue;
    var ss=pct>.05?2:pct>0?1:pct>-.05?-1:-2;
    total+=ss*2; max+=4;
    drivers.push({id:'SP500',name:'S&P Trend',s:ss*2});
  }

  if(!max) return {score:50,drivers:[]};
  var score=Math.round((total+max)/(2*max)*100);
  drivers.sort(function(a,b){return b.s-a.s});
  return {score:score,drivers:drivers};
}

var SIGNALS = {
  'risk-on': {
    label:'RISK ON', icon:'↑', title:'Risk-On Environment',
    body:'Macro tailwinds are broad and aligned. Fundamentals support long exposure. Market conditions favor risk assets.',
    action:'Add to longs — buy quality dips'
  },
  'bullish': {
    label:'BULLISH', icon:'↑', title:'Bullish Conditions',
    body:'More positives than negatives across indicators. Risk-reward favors the upside with disciplined position sizing.',
    action:'Hold longs — selective new entries'
  },
  'neutral': {
    label:'NEUTRAL', icon:'→', title:'Mixed Signals',
    body:'Macro picture is balanced with offsetting forces. Elevated uncertainty — this is not the time for oversized bets.',
    action:'Reduce size — wait for clarity'
  },
  'bearish': {
    label:'BEARISH', icon:'↓', title:'Bearish Conditions',
    body:'Headwinds are building across multiple indicators. Risk-reward is deteriorating. Caution is warranted.',
    action:'Trim exposure — add hedges'
  },
  'risk-off': {
    label:'RISK OFF', icon:'↓', title:'Risk-Off Environment',
    body:'Macro environment is hostile to risk assets. Multiple indicators are flashing warning signals simultaneously.',
    action:'Preserve capital — stay defensive'
  }
};

function getSignalKey(score){
  return score>=70?'risk-on':score>=57?'bullish':score>=43?'neutral':score>=30?'bearish':'risk-off';
}

function sigColorCls(score){
  return score>=57?'c-g':score>=43?'c-y':score>=30?'c-o':'c-r';
}

// ═══════════════════════════════════════════════════
// RENDER INDICATORS
// ═══════════════════════════════════════════════════
function renderIndicators(result) {
  var inds = result.indicators||[];
  var sp500 = null;
  var rest  = inds.filter(function(i){if(i.id==='SP500'){sp500=i;return false}return true});

  var calc = calcScore(inds);
  var key  = getSignalKey(calc.score);
  var sig  = SIGNALS[key];
  var sc   = sigColorCls(calc.score);

  // Hero
  document.getElementById('hero-wrap').className = key;
  document.getElementById('score-num').textContent = calc.score;
  document.getElementById('sig-pill').textContent  = sig.icon + ' ' + sig.label;
  document.getElementById('sig-title').textContent = sig.title;
  document.getElementById('sig-body').textContent  = sig.body;
  document.getElementById('sig-action').textContent = '→ ' + sig.action;

  // Drivers
  var dEl = document.getElementById('drivers');
  dEl.innerHTML = '';
  calc.drivers.filter(function(d){return d.s>0}).slice(0,3).forEach(function(d){
    var t=document.createElement('span');
    t.className='driver-chip d-bull'; t.textContent='▲ '+d.name; dEl.appendChild(t);
  });
  calc.drivers.filter(function(d){return d.s<0}).slice(-3).reverse().forEach(function(d){
    var t=document.createElement('span');
    t.className='driver-chip d-bear'; t.textContent='▼ '+d.name; dEl.appendChild(t);
  });

  // Metrics strip
  var strip = document.getElementById('metrics-strip');
  strip.innerHTML = '';
  var metricIds = ['VIX','FG','T10Y2Y','FEDFUNDS','CPI','UNRATE','PMI','GDP'];
  var map = {};
  inds.forEach(function(i){map[i.id]=i});
  metricIds.forEach(function(id){
    var cfg=CFG[id], ind=map[id];
    if(!cfg||!ind||ind.rawValue===null) return;
    var s=cfg.score(ind.rawValue);
    var cc=s>0?'bg-g':s<0?(s<-1?'bg-r':'bg-o'):'bg-y';
    var vc=s>0?'c-g':s<0?(s<-1?'c-r':'c-o'):'c-y';
    var chg='';
    if(ind.previousValue!==null){
      var d=ind.rawValue-ind.previousValue;
      chg='<span class="metric-chg '+(d>0?'c-g':d<0?'c-r':'')+'">'+
        (d>0?'▲':d<0?'▼':'—')+Math.abs(d).toFixed(2)+'</span>';
    }
    var pill=document.createElement('div');
    pill.className='metric-pill';
    pill.innerHTML='<div class="metric-dot '+cc+'"></div>'+
      '<span class="metric-name">'+esc(cfg.label)+'</span>'+
      '<span class="metric-val '+vc+'">'+ind.rawValue.toFixed(2)+(cfg.unit?'<span style="font-size:.75em;opacity:.7"> '+esc(cfg.unit)+'</span>':'')+'</span>'+
      (chg?chg:'');
    strip.appendChild(pill);
  });

  // SP500 pill
  if(sp500&&sp500.rawValue){
    var pct=sp500.previousValue?((sp500.rawValue-sp500.previousValue)/sp500.previousValue*100):null;
    var pill=document.createElement('div');
    pill.className='metric-pill';
    var vc2=pct===null?'':pct>=0?'c-g':'c-r';
    pill.innerHTML='<div class="metric-dot '+(pct===null?'':pct>=0?'bg-g':'bg-r')+'"></div>'+
      '<span class="metric-name">SPY</span>'+
      '<span class="metric-val">$'+sp500.rawValue.toFixed(2)+'</span>'+
      (pct!==null?'<span class="metric-chg '+vc2+'">'+(pct>=0?'▲':'▼')+Math.abs(pct).toFixed(1)+'%</span>':'');
    strip.appendChild(pill);
  }

  // Indicator cards
  var grid = document.getElementById('ind-grid');
  grid.innerHTML = '';
  rest.forEach(function(ind){
    var cfg=CFG[ind.id];
    if(!cfg||ind.rawValue===null) return;
    var s=cfg.score(ind.rawValue);
    var cc=s>0?'c-g':s<0?(s<-1?'c-r':'c-o'):'c-y';
    var bl=s>0?'Bullish':s<0?(s<-1?'Bearish':'Caution'):'Neutral';

    var chgHtml='';
    if(ind.previousValue!==null){
      var d=ind.rawValue-ind.previousValue;
      var ac=d>0?'c-g':d<0?'c-r':'';
      var ar=d>0?'▲':d<0?'▼':'—';
      chgHtml='<span class="'+ac+'">'+ar+'</span> prev '+ind.previousValue.toFixed(2)+
        ' <span style="opacity:.5">('+( d>=0?'+':'' )+d.toFixed(2)+')</span>';
    }

    var card=document.createElement('div');
    card.className='ind-card '+cc;
    card.title='Click to view history';
    var _id = ind.id;
    card.onclick = function(){ openHistory(_id); };
    card.innerHTML=
      '<div class="ind-head">'+
        '<span class="ind-name">'+esc(cfg.name)+'</span>'+
        '<span class="ind-badge '+cc+'">'+bl+'</span>'+
      '</div>'+
      '<div class="ind-val '+cc+'">'+ind.rawValue.toFixed(2)+
        (cfg.unit?'<span class="ind-unit">'+esc(cfg.unit)+'</span>':'')+
      '</div>'+
      '<div class="ind-change">'+(chgHtml||'&nbsp;')+'</div>'+
      '<div class="bar-track"><div class="bar-fill '+cc+'" style="width:'+cfg.bar(ind.rawValue)+'%"></div></div>'+
      '<div class="ind-hint">'+esc(cfg.hint(ind.rawValue))+'</div>';
    grid.appendChild(card);
  });

  // SP500
  renderSP500(sp500);

  // Time
  document.getElementById('bar-time').textContent = new Date().toLocaleTimeString();
}

// ═══════════════════════════════════════════════════
// SP500
// ═══════════════════════════════════════════════════
function renderSP500(sp) {
  var wrap=document.getElementById('sp500-wrap');
  if(!sp||sp.rawValue===null){
    wrap.innerHTML='<div style="color:var(--t2);padding:16px;font-size:.85em">No SPY data available</div>';
    return;
  }
  var price=sp.rawValue, sma=sp.previousValue;
  var above=sma&&price>sma;
  var cls=sma?(above?'c-g':'c-r'):'';
  var pct=sma?((price-sma)/sma*100):null;
  var pColor=above?'var(--green)':'var(--red)';

  var barHtml='';
  if(sma){
    var lo=sma*.87,hi=sma*1.13,rng=hi-lo;
    var smaPct=cl((sma-lo)/rng*100);
    var prPct =cl((price-lo)/rng*100);
    var fillL=Math.min(smaPct,prPct);
    var fillW=Math.abs(prPct-smaPct);
    barHtml=
      '<div class="sp-bar-label">'+
        '<span>−13% from SMA200</span>'+
        '<span style="color:var(--yellow)">▲ SMA200 = $'+sma.toFixed(2)+'</span>'+
        '<span>+13% from SMA200</span>'+
      '</div>'+
      '<div class="sp-track">'+
        '<div class="sp-zone '+(above?'c-g':'c-r')+'" style="left:'+fillL+'%;width:'+fillW+'%;background:'+(above?'var(--green)':'var(--red)')+';height:100%;border-radius:100px"></div>'+
        '<div class="sp-sma-line" style="left:'+smaPct+'%"></div>'+
        '<div class="sp-cursor"  style="left:'+prPct+'%"></div>'+
      '</div>'+
      '<div class="sp-legend"><span>Underperforming</span><span>Outperforming</span></div>'+
      '<div class="sp-status">'+
        '<span style="color:'+(above?'var(--green)':'var(--red))') + ';font-weight:600">'+
          (above?'▲ Above':'▼ Below')+' SMA200</span>'+
        (pct!==null?' — '+'<span style="font-weight:600;color:'+(above?'var(--green)':'var(--red)')+'">'+(pct>=0?'+':'')+pct.toFixed(2)+'%</span>':'') +
      '</div>';
  }

  wrap.innerHTML=
    '<div class="sp500-card '+cls+'" onclick="openHistory(\'SP500\')" title="Click to view history" style="cursor:pointer">'+
      '<div>'+
        '<div class="sp-ticker">SPY / S&amp;P 500</div>'+
        '<div class="sp-price" style="color:'+(sma?(above?'var(--green)':'var(--red)'):'var(--text)')+'">$'+price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>'+
        (pct!==null?'<div class="sp-pct" style="color:'+(above?'var(--green)':'var(--red)')+'">'+(pct>=0?'+':'')+pct.toFixed(2)+'% vs SMA200</div>':'') +
        (sma?'<div class="sp-sma-val">200-day SMA: $'+sma.toFixed(2)+'</div>':'') +
      '</div>'+
      '<div>'+barHtml+'</div>'+
    '</div>';
}

// ═══════════════════════════════════════════════════
// HOLDINGS
// ═══════════════════════════════════════════════════
function renderHoldings(result) {
  var wrap   = document.getElementById('holdings-wrap');
  var inds   = result.holdings||[];
  var conn   = result.isConnected;

  if(!conn){
    google.script.run.withSuccessHandler(function(url){
      var lk=document.getElementById('plaid-setup-link');
      lk.href=url+'?page=plaid-setup'; lk.style.display='inline';
    }).withFailureHandler(function(){}).getWebAppUrl();

    wrap.innerHTML=
      '<div class="plaid-cta">'+
        '<h3>📊 Connect Your Firstrade Account</h3>'+
        '<p>Link via Plaid to track your real-time holdings, cost basis, and unrealized P&L directly in this dashboard.</p>'+
        '<a id="cta-btn" href="#" class="plaid-btn">Connect Firstrade via Plaid</a>'+
      '</div>';
    google.script.run.withSuccessHandler(function(url){
      var b=document.getElementById('cta-btn'); if(b) b.href=url+'?page=plaid-setup';
    }).withFailureHandler(function(){}).getWebAppUrl();
    return;
  }

  if(!inds.length){
    wrap.innerHTML='<div class="plaid-cta"><h3>✅ Plaid Connected</h3>'+
      '<p>No holdings yet. Run <code>fetchPlaidHoldings()</code> in the GAS editor or wait for the 06:00 auto-fetch.</p></div>';
    return;
  }

  var totalVal=result.totalValue, totalPnl=result.totalPnl;
  var pnlPct=totalPnl!==null&&totalVal?(totalPnl/(totalVal-totalPnl)*100):null;
  var pclr=totalPnl!==null?(totalPnl>=0?'var(--green)':'var(--red)'):'var(--text)';
  var psign=totalPnl!==null?(totalPnl>=0?'+':' '):'';

  var summary=
    '<div class="port-summary">'+
      portCell('Total Value', '$'+fmt(totalVal), 'var(--text)')+
      (totalPnl!==null?portCell('Unrealized P&L',
        psign+'$'+fmt(totalPnl)+(pnlPct!==null?' ('+psign+pnlPct.toFixed(2)+'%)':''), pclr):'')+
      portCell('Positions', inds.length+' holdings', 'var(--blue)')+
      portCell('As of', inds[0]?String(inds[0].date):'—', 'var(--t2)')+
    '</div>';

  var rows=inds.map(function(h){
    var pnlHtml='<span style="color:var(--t3)">—</span>';
    if(h.unrealized_pnl!==null){
      var c=h.unrealized_pnl>=0?'var(--green)':'var(--red)';
      var s=h.unrealized_pnl>=0?'+':'';
      pnlHtml='<span style="color:'+c+';font-weight:600">'+s+'$'+fmt(h.unrealized_pnl)+'</span>';
      if(h.unrealized_pnl_pct!==null)
        pnlHtml+=' <span style="color:'+c+';font-size:.85em">('+s+h.unrealized_pnl_pct.toFixed(2)+'%)</span>';
    }
    return '<tr>'+
      '<td><span class="ticker">'+esc(h.ticker||'—')+'</span></td>'+
      '<td><span class="sec-name">'+esc(h.security_name||'')+'</span></td>'+
      '<td><span class="type-chip">'+esc(h.type||'')+'</span></td>'+
      '<td class="r">'+fmt4(h.quantity)+'</td>'+
      '<td class="r">$'+fmt(h.close_price)+'</td>'+
      '<td class="r" style="font-weight:600">$'+fmt(h.market_value)+'</td>'+
      '<td class="r">'+pnlHtml+'</td>'+
      '</tr>';
  }).join('');

  var tbl=
    '<table class="holdings-tbl">'+
      '<thead><tr><th>Ticker</th><th>Security</th><th>Type</th>'+
      '<th style="text-align:right">Qty</th><th style="text-align:right">Price</th>'+
      '<th style="text-align:right">Mkt Value</th><th style="text-align:right">Unrealized P&L</th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table>';

  wrap.innerHTML=summary+tbl;
}

function portCell(l,v,c){
  return '<div class="port-cell"><div class="port-label">'+l+'</div>'+
    '<div class="port-val" style="color:'+c+'">'+esc(String(v))+'</div></div>';
}
function fmt(v) {if(v===null||v===undefined)return '—'; return Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt4(v){if(v===null||v===undefined)return '—'; return Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:4})}

// ═══════════════════════════════════════════════════
// STATUS / LOGS
// ═══════════════════════════════════════════════════
function renderStatus(result){
  var body=document.getElementById('log-body');
  var logs=result.recentLogs||[];
  if(!logs.length){body.innerHTML='<tr><td colspan="3" style="color:var(--t2)">No logs yet</td></tr>';return}
  body.innerHTML='';
  logs.slice().reverse().forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML='<td style="white-space:nowrap">'+esc(String(r.timestamp))+'</td>'+
      '<td><span class="log-tag">'+esc(r.module)+'</span></td>'+
      '<td>'+esc(r.message)+'</td>';
    body.appendChild(tr);
  });
}

// HISTORY MODAL

var _histChart   = null;
var _activeId    = null;
var _activeDays  = 180;

var IND_META = {
  FEDFUNDS:{ label:'Federal Funds Rate',     unit:'%',    zero:false },
  T10Y2Y:  { label:'Yield Curve (10Y-2Y)',   unit:'%',    zero:true  },
  DGS10:   { label:'10-Year Treasury Yield', unit:'%',    zero:false },
  CPI:     { label:'CPI Inflation (ann.)',   unit:'%',    zero:true  },
  UNRATE:  { label:'Unemployment Rate',      unit:'%',    zero:false },
  PMI:     { label:'ISM Manufacturing PMI',  unit:'',     zero:true  },
  GDP:     { label:'GDP Growth (ann.)',       unit:'%',    zero:true  },
  VIX:     { label:'VIX Volatility Index',   unit:'',     zero:false },
  FG:      { label:'Fear & Greed Index',     unit:'/100', zero:false },
  SP500:   { label:'SPY / S&P 500 Price',    unit:'$',    zero:false }
};

function openHistory(id) {
  _activeId   = id;
  _activeDays = 180;

  var meta = IND_META[id] || { label: id, unit: '', zero: false };
  document.getElementById('modal-title').textContent = meta.label;
  document.getElementById('modal-meta').textContent  = '— loading —';

  document.querySelectorAll('.range-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.days == _activeDays);
  });

  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-loading').style.display = 'flex';
  document.getElementById('hist-chart').style.display    = 'none';

  loadHistory(id, _activeDays);
}

function setRange(days) {
  _activeDays = days;
  document.querySelectorAll('.range-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.days == days);
  });
  document.getElementById('modal-loading').style.display = 'flex';
  document.getElementById('hist-chart').style.display    = 'none';
  loadHistory(_activeId, days);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  if (_histChart) { _histChart.destroy(); _histChart = null; }
}

function loadHistory(id, days) {
  google.script.run
    .withSuccessHandler(renderHistoryChart)
    .withFailureHandler(function(e) {
      document.getElementById('modal-loading').textContent = 'Error: ' + esc(e.message);
    })
    .getIndicatorHistory(id, days);
}

function renderHistoryChart(data) {
  var dates  = data.dates  || [];
  var values = data.values || [];
  if (!dates.length) {
    document.getElementById('modal-loading').textContent = 'No history data available yet. Run fetchHistoricalData() in the GAS editor first.';
    return;
  }

  var meta = IND_META[data.id] || { label: data.id, unit: '', zero: false };

  // Stats
  var cur = values[values.length - 1];
  var hi  = Math.max.apply(null, values);
  var lo  = Math.min.apply(null, values);
  var avg = values.reduce(function(a,b){return a+b},0) / values.length;

  document.getElementById('modal-meta').textContent  = dates[0] + ' → ' + dates[dates.length-1] + ' (' + dates.length + ' data pts)';
  document.getElementById('stat-cur').textContent  = meta.unit === '$' ? '$'+fmt(cur) : cur.toFixed(2)+(meta.unit||'');
  document.getElementById('stat-hi').textContent   = meta.unit === '$' ? '$'+fmt(hi)  : hi.toFixed(2)+(meta.unit||'');
  document.getElementById('stat-lo').textContent   = meta.unit === '$' ? '$'+fmt(lo)  : lo.toFixed(2)+(meta.unit||'');
  document.getElementById('stat-avg').textContent  = meta.unit === '$' ? '$'+fmt(avg) : avg.toFixed(2)+(meta.unit||'');

  // Color based on current value vs avg
  var lineColor = cur >= avg ? '#22c55e' : '#ef4444';

  // Chart
  document.getElementById('modal-loading').style.display = 'none';
  var canvas = document.getElementById('hist-chart');
  canvas.style.display = 'block';

  if (_histChart) _histChart.destroy();

  _histChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        data: values,
        borderColor: lineColor,
        backgroundColor: lineColor.replace(')', ', 0.06)').replace('rgb', 'rgba'),
        borderWidth: 1.5,
        pointRadius: dates.length > 100 ? 0 : 3,
        pointHoverRadius: 5,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#252836',
          borderWidth: 1,
          titleColor: '#b0bccf',
          bodyColor: '#f0f3f8',
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              return meta.unit === '$' ? ' $' + fmt(v) : ' ' + v.toFixed(2) + (meta.unit||'');
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,.04)' },
          ticks: {
            color: '#8892a4', maxTicksLimit: 8, maxRotation: 0,
            callback: function(val, idx) {
              var d = this.getLabelForValue(val);
              return d ? d.substring(0, 7) : '';
            }
          }
        },
        y: {
          grid: { color: 'rgba(255,255,255,.04)' },
          ticks: {
            color: '#8892a4',
            callback: function(v) {
              return meta.unit === '$' ? '$' + v.toFixed(0) : v.toFixed(1) + (meta.unit||'');
            }
          },
          afterDataLimits: meta.zero ? function(axis) {
            if (axis.min > 0 && axis.max > 0) return;
            if (axis.max < 0 && axis.min < 0) return;
            // add zero line reference
          } : undefined
        }
      }
    }
  });
}

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal({target: document.getElementById('modal-overlay')});
});

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function loadAll(){
  document.getElementById('bar-time').textContent = 'Updating…';

  google.script.run
    .withSuccessHandler(renderIndicators)
    .withFailureHandler(function(e){
      document.getElementById('ind-grid').innerHTML=
        '<div style="color:var(--red);padding:16px;font-size:.85em">'+esc(e.message)+'</div>';
    })
    .getIndicatorsForDashboard();

  google.script.run
    .withSuccessHandler(renderStatus)
    .withFailureHandler(function(){})
    .getStatusForDashboard();

  google.script.run
    .withSuccessHandler(renderHoldings)
    .withFailureHandler(function(e){
      document.getElementById('holdings-wrap').innerHTML=
        '<div style="color:var(--t2);padding:16px;font-size:.83em">'+esc(e.message)+'</div>';
    })
    .getHoldingsForDashboard();
}

loadAll();
